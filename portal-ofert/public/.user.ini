; Limity PHP dla portalu (cPanel/PHP-FPM czyta ten plik z document root; zmiany działają po ~5 min).
; Zdjęcia do 10 MB i dokumenty do 25 MB (limits w presecie) + zapas na kilka plików naraz.
upload_max_filesize = 30M
post_max_size = 64M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120
expose_php = Off
